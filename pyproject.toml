[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-serverless-task-api"
version = "0.1.0"
description = "A Cognito-authenticated, user-scoped serverless task management API"
requires-python = ">=3.12,<3.13"
dependencies = ["boto3==1.37.18"]

[project.optional-dependencies]
dev = ["moto[dynamodb]==5.1.3", "pytest==8.3.5", "ruff==0.11.2", "PyYAML==6.0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
